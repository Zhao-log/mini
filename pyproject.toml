# 工具配置（ruff / mypy / pytest）。依赖仍由 requirements*.txt 管理。

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".tools", "docs", "web"]

[tool.ruff.lint]
# 只启用确定性高、误报少的规则，保证本地与 CI 结果稳定。
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src", "web_server.py", "main.py"]
